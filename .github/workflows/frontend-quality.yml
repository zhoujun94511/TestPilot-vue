name: Frontend Quality

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'frontend/**'
      - 'blueprints/**'
      - 'app.py'
      - 'scripts/check_api_contract.py'
      - 'tests/test_api_get_snapshots.py'
      - 'tests/fixtures/**'
      - '.github/workflows/frontend-quality.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'blueprints/**'
      - 'app.py'
      - 'scripts/check_api_contract.py'
      - 'tests/test_api_get_snapshots.py'
      - 'tests/fixtures/**'
      - '.github/workflows/frontend-quality.yml'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: API contract (static)
        working-directory: frontend
        run: npm run quality:api-contract

      - name: API GET shape snapshots (Flask test client)
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -m pytest tests/test_api_get_snapshots.py -q --tb=short

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install chromium --with-deps

      - name: Full frontend release gate
        working-directory: frontend
        run: npm run quality:release:full
